name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/host/package-lock.json

      - name: Install host dependencies
        run: npm --prefix apps/host ci

      - name: Build host frontend
        run: npm run host:build
