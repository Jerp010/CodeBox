name: CodeBox main source check

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  source-branch:
    name: CodeBox source branch gate
    runs-on: ubuntu-latest
    steps:
      - name: Verify pull request source
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          BASE_REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          if [ "$HEAD_BRANCH" = "dev" ] && [ -n "$HEAD_REPOSITORY_ID" ] && [ "$HEAD_REPOSITORY_ID" = "$BASE_REPOSITORY_ID" ]; then
            echo "The pull request comes from this repository's dev branch."
          else
            echo "Pull requests to main must come from this repository's dev branch."
            exit 1
          fi
