
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F3EDDB">

    <title>CodeBox | Join a Game</title>

    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./main.js"></script>
</head>

<body>
    <div class="page-wrapper">

        <header class="site-header">
            <a href="/" class="brand">
                <span class="brand-icon">CB</span>
                <span>CODEBOX</span>
            </a>

            <span class="header-label">PLAYER PORTAL</span>
        </header>

        <main class="join-container">

            <section class="join-card">

                <div class="card-decoration">
                    <span class="decoration-symbol">&lt;/&gt;</span>
                    <span class="decoration-dot"></span>
                    <span class="decoration-dot"></span>
                    <span class="decoration-dot"></span>
                </div>

                <div class="welcome-content">
                    <span class="eyebrow">WELCOME, PLAYER!</span>

                    <h1>Ready to<br>
                        <span>play?</span>
                    </h1>

                    <p>
                        Grab your room code from the host
                        and get ready to join the game.
                    </p>
                </div>

                <form id="join-form">

                    <div class="form-group">
                        <label for="player-nickname">YOUR NICKNAME</label>

                        <input
                            type="text"
                            id="player-nickname"
                            name="nickname"
                            placeholder="Enter your nickname"
                            autocomplete="nickname"
                            maxlength="20"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="room-code">ROOM CODE</label>

                        <input
                            type="text"
                            id="room-code"
                            name="roomCode"
                            placeholder="ABC123"
                            maxlength="6"
                            minlength="6"
                            pattern="[A-Za-z0-9]{6}"
                            autocomplete="off"
                            autocapitalize="characters"
                            required
                        >

                        <span class="input-hint">
                            Ask your host for the 6-character code.
                        </span>
                    </div>

                    <button type="submit" id="join-button">
                        <span>JOIN ROOM</span>
                        <span class="button-arrow">→</span>
                    </button>

                    <p id="join-status" class="join-status" role="status"
                        aria-live="polite">
                    </p>

                </form>

                <div class="card-footer">
                    <span>NO ACCOUNT NEEDED</span>
                    <span>JUST PLAY!</span>
                </div>

            </section>

            <footer class="page-footer">
                <p>CODEBOX © 2026</p>
                <p>THINK. TYPE. PLAY.</p>
            </footer>

        </main>

    </div>
</body>
</html>
